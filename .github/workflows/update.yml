name: Update contract

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Output branch (blank uses CONTRACT_PUBLISH_BRANCH or main)
        default: ""
      source_ref:
        description: Private source ref (blank uses CONTRACT_SOURCE_REF or main)
        default: ""
      app_version:
        description: Expected current Google Play versionName, or latest
        default: latest
      force:
        description: Rebuild even when Google Play versionCode matches
        type: boolean
        default: false
      il2cpp_dumper_repository:
        description: Compatible Il2CppDumper repository
        default: https://github.com/vmpprotect/Il2CppDumper.git
      il2cpp_dumper_ref:
        description: Il2CppDumper branch, tag, or commit from report.json
        default: master
      node_image:
        description: Node container image
        default: node:current-slim
      dotnet_sdk_image:
        description: .NET SDK container image
        default: mcr.microsoft.com/dotnet/sdk:latest

permissions:
  contents: write

concurrency:
  group: contract-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.contract.outputs.published }}
      version-name: ${{ steps.contract.outputs.version-name }}
      version-code: ${{ steps.contract.outputs.version-code }}
      source-commit: ${{ steps.published_commit.outputs.source-commit }}
    steps:
      - name: Check out public data repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Check out private extraction source
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CONTRACT_SOURCE_REPOSITORY || 'holodori-net/extract-protos' }}
          ref: ${{ inputs.source_ref || vars.CONTRACT_SOURCE_REF || 'main' }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: Extract and publish contract
        id: contract
        uses: ./source
        with:
          google-play-email: ${{ secrets.PLAY_ACCOUNT_EMAIL }}
          google-play-aas-token: ${{ secrets.PLAY_AAS_TOKEN }}
          target-path: ${{ github.workspace }}/repo
          target-branch: ${{ inputs.target_branch || vars.CONTRACT_PUBLISH_BRANCH || 'main' }}
          app-version: ${{ inputs.app_version || 'latest' }}
          force: ${{ inputs.force && 'true' || 'false' }}
          il2cpp-dumper-repository: ${{ inputs.il2cpp_dumper_repository || 'https://github.com/vmpprotect/Il2CppDumper.git' }}
          il2cpp-dumper-ref: ${{ inputs.il2cpp_dumper_ref || 'master' }}
          node-image: ${{ inputs.node_image || 'node:current-slim' }}
          dotnet-sdk-image: ${{ inputs.dotnet_sdk_image || 'mcr.microsoft.com/dotnet/sdk:latest' }}

      - name: Capture published contract commit
        id: published_commit
        if: steps.contract.outputs.published == 'true'
        shell: bash
        run: |
          source_commit=$(git -C repo rev-parse HEAD)
          echo "source-commit=$source_commit" >> "$GITHUB_OUTPUT"

  notify:
    needs: update
    if: needs.update.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch SDK contract sync
        env:
          GH_TOKEN: ${{ secrets.APIS_DISPATCH_TOKEN }}
          VERSION_NAME: ${{ needs.update.outputs.version-name }}
          VERSION_CODE: ${{ needs.update.outputs.version-code }}
          SOURCE_COMMIT: ${{ needs.update.outputs.source-commit }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "APIS_DISPATCH_TOKEN is required to notify the SDK repository." >&2
            exit 1
          fi

          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The published contract commit is not a full SHA." >&2
            exit 1
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ || ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "The published contract version is invalid." >&2
            exit 1
          fi

          gh api --method POST repos/holodori-net/apis/dispatches \
            -f event_type=android-protos-published \
            -f "client_payload[source_commit]=$SOURCE_COMMIT" \
            -f "client_payload[version_name]=$VERSION_NAME" \
            -f "client_payload[version_code]=$VERSION_CODE"
